# Linux-only optional monitoring; preserves the unrelated existing Grafana stack.
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    network_mode: host
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--web.listen-address=127.0.0.1:9095']
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:11.6.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3005
      GF_SECURITY_ADMIN_PASSWORD: ${PERFSYNC_GRAFANA_PASSWORD:-managed-by-perfsync-launcher}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/perfsync.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  prometheus_data:
  grafana_data:
