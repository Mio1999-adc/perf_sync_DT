[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfsyncgnn"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3", "requests>=2", "traci>=1.20", "paho-mqtt>=2", "confluent-kafka>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["perfsyncgnn*", "simulation*", "synchronization*", "dt*", "monitoring*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires an external service or executable"]
