[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfsyncgnn"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3", "requests>=2", "traci>=1.20", "paho-mqtt>=2", "confluent-kafka>=2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "opentelemetry-sdk>=1.27,<2", "prometheus-client>=0.20,<1", "psutil>=6,<8", "pymongo>=4.6,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["perfsyncgnn*", "simulation*", "synchronization*", "dt*", "monitoring*", "dashboard.backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires an external service or executable"]
